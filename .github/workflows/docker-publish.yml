name: Publish Docker image

on:
  push:
    branches:
      - claude/osint-recon-tool-QCGAi
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Whitespace pasted into the GitHub secret textarea (e.g. a trailing
      # newline) makes docker login fail with "malformed HTTP Authorization
      # header". Trim both secrets before use so the workflow is robust
      # against a slightly messy paste.
      - name: Resolve image name
        id: image
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          user=$(printf '%s' "$DH_USER" | tr -d '[:space:]')
          if [ -z "$user" ]; then
            echo "DOCKERHUB_USERNAME secret is empty or whitespace-only." >&2
            exit 1
          fi
          echo "name=${user}/recon-tool" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user=$(printf '%s' "$DH_USER" | tr -d '[:space:]')
          token=$(printf '%s' "$DH_TOKEN" | tr -d '[:space:]')
          if [ -z "$user" ] || [ -z "$token" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is empty after trimming." >&2
            exit 1
          fi
          printf '%s' "$token" | docker login -u "$user" --password-stdin docker.io

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
