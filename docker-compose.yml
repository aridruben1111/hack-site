services:
  recon-tool:
    build: .
    image: recon-tool:latest
    container_name: recon-tool
    restart: unless-stopped
    ports:
      # IMPORTANT: bound to 127.0.0.1 so the port is NOT exposed to the
      # internet. Docker bypasses UFW — a plain "5174:5174" mapping would be
      # publicly reachable even with `ufw default deny incoming`.
      # On a VPS, keep this and put a reverse proxy in front.
      # For LAN access during local dev, change to "5174:5174".
      - "127.0.0.1:5174:5174"
    environment:
      NODE_ENV: production
      PORT: "5174"
      # SSRF protection is ON by default — blocks targets that resolve to
      # private/loopback/link-local/cloud-metadata addresses. Set to "true"
      # ONLY on a trusted, non-public instance (e.g. internal LAN scanning):
      ALLOW_PRIVATE_TARGETS: "false"
      # Port scanner. Disabled here by default: scanning third parties from
      # a public VPS commonly violates the provider's acceptable-use policy.
      # Set to "true" only where you are authorized to scan:
      ENABLE_PORTSCAN: "false"
      # Uncomment when running behind a reverse proxy so rate limiting
      # uses the real client IP (1 = trust first proxy hop):
      # TRUST_PROXY: "1"
      # Only needed if the client is served from a different origin:
      # CORS_ORIGIN: "https://recon.example.com"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
